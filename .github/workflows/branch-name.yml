  name: Branch name check

  on:
    pull_request:
      branches: [main]

  jobs:
    check-branch-name:
      runs-on: ubuntu-latest
      steps:
        - name: Validate branch name
          env:
            BRANCH: ${{ github.head_ref }}
          run: |
            if [[ ! "$BRANCH" =~ ^(feature|fix)/.+ ]]; then
              echo "Branch '$BRANCH' must start with feature/ or fix/"
              exit 1
            fi
